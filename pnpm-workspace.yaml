# pnpm refuses a package younger than minimumReleaseAge, so our own kit and
# client releases are listed here. Every third-party package stays subject to
# the rule.
minimumReleaseAgeExclude:
  - '@lyeve-labs/ui-kit@0.62.0'
overrides:
  # GHSA-68fv-2mgg-jv7q: source-map-js before 1.2.2, reached through postcss.
  source-map-js: ^1.2.2
minimumReleaseAgeStrict: true

# pnpm only warns when the running Node misses engines.node, so this makes
# an install on an older Node fail instead.
engineStrict: true

# GHSA-3r8g-jcqq-3p5j: a denial of service in the form data parser of
# SvelteKit's remote functions, fixed only in 3.1.1. The console declares no
# remote function, so SvelteKit refuses every remote request before it reads
# the body. src/lib/audit-exceptions.test.ts fails once that stops being true
# and once SvelteKit carries the fix.
auditConfig:
  ignoreGhsas:
    - GHSA-3r8g-jcqq-3p5j
