# pnpm refuses a package younger than minimumReleaseAge, so our own kit and
# client releases are listed here. Every third-party package stays subject to
# the rule.
minimumReleaseAgeExclude:
  - '@lyeve-labs/ui-kit@0.62.0'
overrides:
  # GHSA-68fv-2mgg-jv7q: source-map-js before 1.2.2, reached through postcss.
  source-map-js: ^1.2.2
minimumReleaseAgeStrict: true

# pnpm only warns when the running Node misses engines.node, so this makes
# an install on an older Node fail instead.
engineStrict: true

# GHSA-fc5q-39xc-vjpf: a ReDoS in picomatch through 4.0.7 when an attacker
# writes the glob pattern, with no fixed release yet. picomatch runs only in
# the build and test tooling (vite, vitest, tinyglobby, fdir, svelte-check),
# whose patterns come from this repository's configuration. The server bundle
# holds none of its code, and the runtime image has no node_modules.
# src/lib/audit-exceptions.test.ts fails once shipped source imports a glob
# matcher and once a picomatch above 4.0.7 is installed.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
